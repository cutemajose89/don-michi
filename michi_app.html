<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Escritorio de Michi</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Michi ✦">
<meta name="theme-color" content="#f5f4f0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f4f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; min-height: 100vh; }
.app { max-width: 390px; width: 100%; padding: 16px 16px 90px; }
.header { text-align: center; padding: 20px 0 12px; }
.greeting { font-size: 12px; color: #888; letter-spacing: 0.05em; }
.name { font-size: 24px; font-weight: 500; color: #1a1a1a; margin: 4px 0 2px; }
.date-line { font-size: 12px; color: #888; }
.don-row { display: flex; align-items: flex-end; gap: 10px; margin: 12px 0 8px; }
.don-name { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; margin-bottom: 4px; }
.bubble { border-radius: 14px 14px 14px 2px; padding: 11px 14px; font-size: 13px; line-height: 1.55; flex: 1; }
.sec-title { font-size: 10px; font-weight: 500; color: #888; letter-spacing: 0.07em; text-transform: uppercase; margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; }
.badge { font-size: 10px; background: #D4537E; color: white; padding: 1px 7px; border-radius: 10px; }
.badge-ok { background: #1D9E75 !important; }
.card { background: white; border: 0.5px solid #e8e5e0; border-radius: 16px; padding: 14px 15px; margin-bottom: 10px; }
.card-fire { border-color: #F09595 !important; background: #FCEBEB !important; }
.card-warn { border-color: #FAC775 !important; background: #FAEEDA !important; }
.card-tarea { border-color: #FAC775 !important; background: #FFFBF0 !important; }
.row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 5px; }
.item-title { font-size: 14px; font-weight: 500; color: #1a1a1a; flex: 1; line-height: 1.4; }
.item-desc { font-size: 12px; color: #888; line-height: 1.5; margin-bottom: 8px; }
.tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
.tag-Investigación,.tag-investigación{background:#EEEDFE;color:#3C3489;}
.tag-Docencia,.tag-docencia{background:#E6F1FB;color:#0C447C;}
.tag-Salud,.tag-salud{background:#EAF3DE;color:#3B6D11;}
.tag-Personal,.tag-personal{background:#FBEAF0;color:#72243E;}
.tag-Admin,.tag-admin{background:#F1EFE8;color:#444;}
.tag-Asesorados,.tag-asesorados{background:#FFF3E0;color:#7B4800;}
.deadline-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
.deadline-txt { font-size: 11px; color: #888; }
.deadline-dias { font-size: 11px; font-weight: 500; }
.d-fire{color:#A32D2D;} .d-warn{color:#854F0B;} .d-ok{color:#085041;}
.barra-bg { height: 5px; background: rgba(0,0,0,0.07); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.barra-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.b-fire{background:#E24B4A;} .b-warn{background:#EF9F27;} .b-ok{background:#1D9E75;}
.pasos-row { display: flex; align-items: center; gap: 2px; margin-bottom: 10px; }
.paso-g { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.paso-c { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #ccc; font-size: 9px; display: flex; align-items: center; justify-content: center; color: #888; flex-shrink: 0; cursor: pointer; transition: all 0.15s; }
.paso-c.hecho { background: #1D9E75; border-color: #1D9E75; color: white; }
.paso-c.activo { border-color: #EF9F27; color: #854F0B; font-weight: 600; }
.paso-t { font-size: 9px; color: #888; max-width: 52px; text-align: center; line-height: 1.3; }
.paso-linea { flex: 1; height: 1px; background: #e8e5e0; min-width: 6px; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.btn { font-size: 12px; padding: 7px 13px; border-radius: 16px; border: 0.5px solid #e0ddd8; background: transparent; color: #1a1a1a; cursor: pointer; }
.btn-si{background:#E1F5EE;border-color:#5DCAA5;color:#085041;}
.btn-no{background:#FCEBEB;border-color:#F09595;color:#791F1F;}
.responded-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.responded-tag { font-size: 11px; color: #085041; background: #E1F5EE; padding: 4px 12px; border-radius: 10px; display: inline-block; }
.cambiar-btn { font-size: 11px; color: #888; cursor: pointer; text-decoration: underline; }
.check-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid #f0ede8; }
.check-item:last-child { border-bottom: none; }
.check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #ccc; flex-shrink: 0; margin-top: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.check.done { background: #1D9E75; border-color: #1D9E75; }
.tick { width: 8px; height: 5px; border-left: 2px solid white; border-bottom: 2px solid white; transform: rotate(-45deg) translateY(-1px); }
.check-body { flex: 1; }
.check-txt { font-size: 13px; color: #1a1a1a; line-height: 1.4; }
.check-txt.done { color: #aaa; text-decoration: line-through; }
.thread-toggle { font-size: 11px; color: #888; cursor: pointer; display: flex; align-items: center; gap: 4px; margin-top: 6px; padding: 2px 0; user-select: none; }
.thread-body { display: none; margin-top: 4px; }
.thread-body.open { display: block; }
.thread-dot { width: 6px; height: 6px; border-radius: 50%; background: #D4537E; display: inline-block; margin-left: 3px; vertical-align: middle; }
.convo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.msg-a .msg-bub { background: #f5f4f0; border: 0.5px solid #e8e5e0; border-radius: 10px 10px 10px 2px; padding: 6px 10px; font-size: 11px; color: #888; display: inline-block; max-width: 90%; line-height: 1.4; }
.msg-m { display: flex; justify-content: flex-end; }
.msg-m .msg-bub { background: #EEEDFE; border: 0.5px solid #AFA9EC; border-radius: 10px 10px 2px 10px; padding: 6px 10px; font-size: 11px; color: #3C3489; display: inline-block; max-width: 90%; line-height: 1.4; }
.add-comment { margin-top: 4px; display: flex; gap: 5px; align-items: center; }
.comment-input { flex: 1; font-size: 11px; padding: 4px 9px; border-radius: 12px; border: 0.5px solid #e0ddd8; background: #f9f8f5; color: #1a1a1a; outline: none; font-family: inherit; height: 26px; }
.comment-input::placeholder { color: #bbb; }
.send-btn { width: 24px; height: 24px; border-radius: 50%; background: #534AB7; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cat-mini { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.cat-label { font-size: 11px; color: #888; }
.loading-state,.empty-state { text-align: center; padding: 40px 20px; color: #888; font-size: 13px; }
.screen { display: none; }
.screen.active { display: block; }
.nav { display: flex; justify-content: space-around; padding: 12px 0 6px; border-top: 0.5px solid #e8e5e0; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: #f5f4f0; }
.nav-it { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 12px; position: relative; }
.nav-lbl { font-size: 10px; color: #888; }
.nav-it.active .nav-lbl { color: #1a1a1a; font-weight: 500; }
.notif-dot { width: 7px; height: 7px; border-radius: 50%; background: #D4537E; position: absolute; top: 0; right: 8px; display: none; }
.big-spinner { width: 28px; height: 28px; border: 2px solid #e8e5e0; border-top-color: #534AB7; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.done-btn { font-size: 12px; cursor: pointer; background: #E1F5EE; color: #085041; padding: 6px 14px; border-radius: 12px; border: 0.5px solid #5DCAA5; display: inline-block; }
.completado-badge { font-size: 12px; color: #1D9E75; font-weight: 500; }
.deshacer-link { font-size: 11px; color: #888; cursor: pointer; text-decoration: underline; margin-left: 8px; }
@media (min-width: 768px) {
  body { background: #ece9e3; padding: 24px; }
  .app { background: #f5f4f0; border-radius: 24px; box-shadow: 0 8px 40px rgba(0,0,0,0.10); max-width: 440px; }
  .nav { border-radius: 0 0 24px 24px; max-width: 440px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="greeting" id="top-greeting">buenos días</div>
    <div class="name">Michi ✦</div>
    <div class="date-line" id="top-date"></div>
  </div>
  <div class="don-row">
    <div>
      <div class="don-name" id="don-name" style="color:#3C3489;">Don Pendiente</div>
      <svg id="don-svg" width="52" height="56" viewBox="0 0 100 110" fill="none">
        <path d="M18 56 Q18 24 30 15 L33 30 Q38 26 50 26 Q62 26 67 30 L70 15 Q82 24 82 56 Q82 78 50 80 Q18 78 18 56Z" fill="#1a1a1a"/>
        <path d="M30 15 L33 30 Q30 23 25 19Z" fill="#1a1a1a"/>
        <path d="M70 15 L67 30 Q70 23 75 19Z" fill="#1a1a1a"/>
        <line x1="24" y1="51" x2="44" y2="51" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <line x1="56" y1="51" x2="76" y2="51" stroke="white" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="50" cy="65" rx="5" ry="3.5" fill="white"/>
        <path d="M50 68 Q50 76 50 78" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="50" cy="80" rx="3.5" ry="2.5" fill="white" opacity="0.9"/>
        <circle cx="8" cy="55" r="5.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="9" cy="41" r="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="10" cy="30" r="2.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="bubble" id="don-bubble" style="background:#EEEDFE;border:0.5px solid #AFA9EC;color:#3C3489;">Cargando tu día, Michi...</div>
  </div>

  <div class="screen active" id="screen-hoy"><div id="hoy-container"><div class="big-spinner"></div></div></div>
  <div class="screen" id="screen-deadlines"><div id="deadlines-container"><div class="big-spinner"></div></div></div>
  <div class="screen" id="screen-correos"><div id="correos-container"><div class="big-spinner"></div></div></div>
  <div class="screen" id="screen-historial"><div id="historial-container"><div class="big-spinner"></div></div></div>

  <div class="nav">
    <div class="nav-it active" id="nav-hoy" onclick="switchScreen('hoy')">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="2" fill="#1a1a1a"/><rect x="11" y="2" width="7" height="7" rx="2" fill="#ccc"/><rect x="2" y="11" width="7" height="7" rx="2" fill="#ccc"/><rect x="11" y="11" width="7" height="7" rx="2" fill="#ccc"/></svg>
      <div class="nav-lbl">hoy</div>
      <div class="notif-dot" id="notif-hoy"></div>
    </div>
    <div class="nav-it" id="nav-deadlines" onclick="switchScreen('deadlines');loadDeadlines();">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="13" rx="2" stroke="#888" stroke-width="1.5"/><path d="M6 2v4M14 2v4M2 8h16" stroke="#888" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div class="nav-lbl">deadlines</div>
      <div class="notif-dot" id="notif-deadlines"></div>
    </div>
    <div class="nav-it" id="nav-correos" onclick="switchScreen('correos');loadCorreos();">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 3h14v9a2 2 0 01-2 2H5a2 2 0 01-2-2V3z" stroke="#888" stroke-width="1.5"/><path d="M3 7h14M3 7l7 5 7-5" stroke="#888" stroke-width="1.5"/></svg>
      <div class="nav-lbl">correos</div>
      <div class="notif-dot" id="notif-correos"></div>
    </div>
    <div class="nav-it" id="nav-historial" onclick="switchScreen('historial');loadHistorial();">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="#888" stroke-width="1.5"/><path d="M10 6v4l3 2" stroke="#888" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div class="nav-lbl">historial</div>
    </div>
  </div>
</div>

<script>
const TOKEN='patMCJ3Vrz8Uw32sO.9288ac142ac8780a9b1f02c10300158c138699ee85b4c11e1ee267d892161426';
const BASE_ID='appz6fdbkJTA1S0GW';
const diasN=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const mesesN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const hoy=new Date(); hoy.setHours(0,0,0,0);
document.getElementById('top-date').textContent=`${diasN[hoy.getDay()]} ${hoy.getDate()} de ${mesesN[hoy.getMonth()]}`;

async function api(path){const res=await fetch(`https://api.airtable.com/v0/${BASE_ID}/${path}`,{headers:{'Authorization':`Bearer ${TOKEN}`}});return res.json();}
async function apiPost(table,fields){const res=await fetch(`https://api.airtable.com/v0/${BASE_ID}/${table}`,{method:'POST',headers:{'Authorization':`Bearer ${TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({fields})});return res.json();}
async function apiPatch(table,id,fields){const res=await fetch(`https://api.airtable.com/v0/${BASE_ID}/${table}/${id}`,{method:'PATCH',headers:{'Authorization':`Bearer ${TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({fields})});return res.json();}

function diasRestantes(f){if(!f)return null;const d=new Date(f);d.setHours(0,0,0,0);return Math.ceil((d-hoy)/86400000);}
function fechaBonita(f){if(!f)return'';const d=new Date(f);return`${diasN[d.getDay()]} ${d.getDate()} de ${mesesN[d.getMonth()]}`;}
function barraColor(d){if(d<=0)return{bar:'b-fire',text:'d-fire',pct:3};if(d<=1)return{bar:'b-fire',text:'d-fire',pct:5};if(d<=7)return{bar:'b-warn',text:'d-warn',pct:Math.min(35,d*5)};return{bar:'b-ok',text:'d-ok',pct:Math.min(90,d*2)};}
function diasLabel(d){if(d===null)return'';if(d<0)return`venció hace ${Math.abs(d)} día${Math.abs(d)>1?'s':''}`;if(d===0)return'vence hoy';if(d===1)return'mañana';return`${d} días`;}
function isUrgente(d){return d!==null&&d<=1;}
function isWarn(d){return d!==null&&d>1&&d<=7;}

function donSVG(mode){
  const base=`<path d="M18 56 Q18 24 30 15 L33 30 Q38 26 50 26 Q62 26 67 30 L70 15 Q82 24 82 56 Q82 78 50 80 Q18 78 18 56Z" fill="#1a1a1a"/><path d="M30 15 L33 30 Q30 23 25 19Z" fill="#1a1a1a"/><path d="M70 15 L67 30 Q70 23 75 19Z" fill="#1a1a1a"/>`;
  if(mode==='urgencia')return base+`<circle cx="35" cy="52" r="14" fill="white"/><circle cx="65" cy="52" r="14" fill="white"/><circle cx="35" cy="52" r="10" fill="#55cc44"/><circle cx="65" cy="52" r="10" fill="#55cc44"/><circle cx="35" cy="52" r="6" fill="#1a1a1a"/><circle cx="65" cy="52" r="6" fill="#1a1a1a"/><circle cx="38" cy="47" r="3.5" fill="white"/><circle cx="68" cy="47" r="3.5" fill="white"/><path d="M43 70 L50 63 L57 70" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M77 18 Q79 10 82 9 Q85 11 83 18 Q81 23 77 20Z" fill="#6ec6f5"/><path d="M83 32 Q86 24 89 24 Q91 27 89 33 Q87 38 83 35Z" fill="#6ec6f5"/><path d="M23 18 Q21 10 18 9 Q15 11 17 18 Q19 23 23 20Z" fill="#6ec6f5"/><path d="M17 32 Q14 24 11 24 Q9 27 11 33 Q13 38 17 35Z" fill="#6ec6f5"/>`;
  if(mode==='pendiente')return base+`<line x1="24" y1="51" x2="44" y2="51" stroke="white" stroke-width="3" stroke-linecap="round"/><line x1="56" y1="51" x2="76" y2="51" stroke="white" stroke-width="3" stroke-linecap="round"/><ellipse cx="50" cy="65" rx="5" ry="3.5" fill="white"/><path d="M50 68 Q50 76 50 78" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/><ellipse cx="50" cy="80" rx="3.5" ry="2.5" fill="white" opacity="0.9"/><circle cx="8" cy="55" r="5.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="9" cy="41" r="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="10" cy="30" r="2.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>`;
  if(mode==='feliz')return base+`<clipPath id="cl"><rect x="22" y="40" width="24" height="12"/></clipPath><circle cx="34" cy="51" r="11" fill="#55cc44" clip-path="url(#cl)"/><circle cx="34" cy="51" r="7" fill="#1a1a1a" clip-path="url(#cl)"/><circle cx="37" cy="47" r="3" fill="white" clip-path="url(#cl)"/><clipPath id="cr"><rect x="54" y="40" width="24" height="12"/></clipPath><circle cx="66" cy="51" r="11" fill="#55cc44" clip-path="url(#cr)"/><circle cx="66" cy="51" r="7" fill="#1a1a1a" clip-path="url(#cr)"/><circle cx="69" cy="47" r="3" fill="white" clip-path="url(#cr)"/><path d="M43 63 Q50 68 57 63" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M43 63 Q50 69 57 63" fill="white"/>`;
  return base+`<circle cx="35" cy="52" r="9" fill="#55cc44"/><circle cx="65" cy="52" r="9" fill="#55cc44"/><circle cx="35" cy="52" r="5" fill="#1a1a1a"/><circle cx="65" cy="52" r="5" fill="#1a1a1a"/><circle cx="37" cy="49" r="2.5" fill="white"/><circle cx="67" cy="49" r="2.5" fill="white"/>`;
}

function setDon(mode,name,bubble,s){
  document.getElementById('don-svg').innerHTML=donSVG(mode);
  document.getElementById('don-name').textContent=name;
  document.getElementById('don-name').style.color=s.color;
  const b=document.getElementById('don-bubble');
  b.textContent=bubble;
  b.style.cssText=`background:${s.bg};border:0.5px solid ${s.border};color:${s.color};border-radius:14px 14px 14px 2px;padding:11px 14px;font-size:13px;line-height:1.55;flex:1;`;
}

function sendIcon(){return`<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M1 6h10M7 2l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}

// ── Comments ──────────────────────────────────────────────────────────────────
let allComments = [];

async function loadAllComments(){
  try{const d=await api('Comentarios?maxRecords=200');allComments=d.records||[];}catch(e){}
}

function getComments(recordId){
  return allComments.filter(r=>{
    const t=r.fields['Tarea'];
    if(!t)return false;
    if(Array.isArray(t))return t.includes(recordId);
    return t===recordId;
  }).sort((a,b)=>new Date(a.createdTime)-new Date(b.createdTime));
}

function makeCommentBox(recordId,quien){
  const comments=getComments(recordId);
  const last=comments.length>0?comments[comments.length-1]:null;
  const isNew=last&&last.fields['De']==='Asistente';

  let previewHtml='';
  if(last){
    const de=last.fields['De'];
    const txt=last.fields['Comentario']||'';
    const bubStyle=de==='Michi'?'background:#EEEDFE;border:0.5px solid #AFA9EC;border-radius:10px 10px 2px 10px;color:#3C3489;':'background:#f5f4f0;border:0.5px solid #e8e5e0;border-radius:10px 10px 10px 2px;color:#888;';
    previewHtml=`<div style="cursor:pointer;margin-top:6px;" onclick="event.stopPropagation();toggleThread('${recordId}')">
      <div style="font-size:11px;padding:6px 10px;${bubStyle}max-width:88%;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;">${txt}</div>
      ${isNew?'<span class="thread-dot" style="margin-left:4px;vertical-align:middle;"></span>':''}
    </div>`;
  }

  const convoHtml=comments.map(r=>{
    const de=r.fields['De'];
    const cls=de==='Michi'?'msg-m':'msg-a';
    return`<div class="${cls}"><div class="msg-bub">${r.fields['Comentario']||''}</div></div>`;
  }).join('');

  const labelTxt=comments.length>0?`ver más mensajes${isNew?'<span class="thread-dot"></span>':''}`:'💬 comentar';

  return`${previewHtml}
  <div class="thread-toggle" onclick="event.stopPropagation();toggleThread('${recordId}')"><span id="tl-${recordId}">${labelTxt}</span></div>
  <div class="thread-body" id="tb-${recordId}">
    <div class="convo" id="cv-${recordId}">${convoHtml}</div>
    <div class="add-comment" data-id="${recordId}" style="margin-top:4px;">
      <input class="comment-input" placeholder="comenta algo..." onclick="event.stopPropagation()" autocomplete="off"
        onkeydown="if(event.key==='Enter'){event.stopPropagation();sendComment(this,'${quien}');}"/>
      <button class="send-btn" onclick="event.stopPropagation();sendComment(this.previousElementSibling,'${quien}');">${sendIcon()}</button>
    </div>
  </div>`;
}

function toggleThread(id){
  const body=document.getElementById('tb-'+id);
  const label=document.getElementById('tl-'+id);
  if(!body)return;
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open');
  if(label)label.textContent=isOpen?'ver más mensajes':'cerrar conversación';
}

async function sendComment(inputEl,quien){
  const text=inputEl.value.trim();if(!text)return;
  const recordId=inputEl.closest('.add-comment').dataset.id;
  inputEl.value='';
  const convoEl=document.getElementById('cv-'+recordId);
  const div=document.createElement('div');
  div.className=quien==='Michi'?'msg-m':'msg-a';
  div.innerHTML=`<div class="msg-bub">${text}</div>`;
  if(convoEl)convoEl.appendChild(div);
  const rec=await apiPost('Comentarios',{'Comentario':text,'Tarea':[recordId],'De':quien});
  allComments.push(rec);
  if(quien==='Michi')await apiPatch('Tareas',recordId,{'Respuesta de Michi':text});
}

// ── Pasos ─────────────────────────────────────────────────────────────────────
let allPasos=[];
async function loadAllPasos(){
  try{const d=await api('Pasos?maxRecords=100');allPasos=d.records||[];}catch(e){}
}
function getPasos(tareaId){
  return allPasos.filter(r=>{const t=r.fields['Tarea'];return Array.isArray(t)&&t.includes(tareaId);})
    .sort((a,b)=>(a.fields['Orden']||0)-(b.fields['Orden']||0));
}
function makePasosHtml(tareaId,clickable){
  const pasos=getPasos(tareaId);
  if(!pasos.length)return'';
  let html='<div class="pasos-row">';
  pasos.forEach((p,i)=>{
    const hecho=p.fields['Hecho'];
    const prevDone=i===0||pasos.slice(0,i).every(x=>x.fields['Hecho']);
    const cls=hecho?'hecho':prevDone?'activo':'';
    const clickHandler=clickable?`onclick="togglePaso('${p.id}','${tareaId}');event.stopPropagation();"`:'' ;
    html+=`<div class="paso-g"><div class="paso-c ${cls}" ${clickHandler}>${hecho?'✓':(i+1)}</div><div class="paso-t">${p.fields['Paso']||''}</div></div>`;
    if(i<pasos.length-1)html+='<div class="paso-linea"></div>';
  });
  return html+'</div>';
}
async function togglePaso(pasoId,tareaId){
  const paso=allPasos.find(p=>p.id===pasoId);
  if(!paso)return;
  const newVal=!paso.fields['Hecho'];
  paso.fields['Hecho']=newVal;
  await apiPatch('Pasos',pasoId,{'Hecho':newVal});
  // Re-render pasos for this tarea
  document.querySelectorAll(`[data-tarea-pasos="${tareaId}"]`).forEach(el=>{
    el.innerHTML=makePasosHtml(tareaId,true);
  });
  // Update barra
  const pasos=getPasos(tareaId);
  const done=pasos.filter(p=>p.fields['Hecho']).length;
  const pct=pasos.length>0?Math.round((done/pasos.length)*100):0;
  const barra=document.getElementById('barra-'+tareaId);
  if(barra){
    const col=pct===100?'b-ok':pct>50?'b-warn':'b-fire';
    barra.className='barra-fill '+col;
    barra.style.width=Math.max(3,pct)+'%';
  }
}

// ── Respond buttons ───────────────────────────────────────────────────────────
async function respondBtn(btn,recordId,valor){
  event.stopPropagation();
  const row=btn.closest('.btn-row');
  row.outerHTML=`<div class="responded-row"><span class="responded-tag">✓ ${valor}</span><span class="cambiar-btn" onclick="deshacerResp('${recordId}',this)">cambiar</span></div>`;
  await apiPatch('Tareas',recordId,{'Respuesta de Michi':valor,'Estado':'Hecho'});
  const badge=document.getElementById('q-badge');
  if(badge){let n=Math.max(0,parseInt(badge.textContent)-1);badge.textContent=n;if(n===0)badge.classList.add('badge-ok');}
}
async function deshacerResp(recordId,el){

  wrap.outerHTML=`<div class="btn-row"><div class="btn btn-si" onclick="respondBtn(this,'${recordId}','sí')">sí</div><div class="btn btn-no" onclick="respondBtn(this,'${recordId}','no')">no</div><div class="btn" onclick="respondBtn(this,'${recordId}','después')">después</div></div>`;
  await apiPatch('Tareas',recordId,{'Respuesta de Michi':'','Estado':'Pendiente'});
}

// ── Load HOY ──────────────────────────────────────────────────────────────────
async function loadHoy(){
  const container=document.getElementById('hoy-container');
  try{
    await Promise.all([loadAllComments(),loadAllPasos()]);
    const data=await api(`Tareas?sort%5B0%5D%5Bfield%5D=Orden&sort%5B0%5D%5Bdirection%5D=asc`);
    const records=data.records||[];
    const active=records.filter(r=>r.fields['Estado']!=='Hecho');

    // Urgentes = urgente flag OR deadline venciendo hoy/mañana
    const urgentes=active.filter(r=>{
      if(r.fields['Urgente']&&r.fields['Tipo']!=='Deadline')return true;
      if(r.fields['Tipo']==='Deadline'){const d=diasRestantes(r.fields['Fecha límite']);return d!==null&&d<=1;}
      return false;
    });
    const preguntas=active.filter(r=>r.fields['Tipo']==='Pregunta');
    const correos=active.filter(r=>r.fields['Tipo']==='Correo');
    const tareas=active.filter(r=>r.fields['Tipo']==='Tarea'&&!r.fields['Urgente']);
    const eventos=active.filter(r=>r.fields['Tipo']==='Evento');

    if(urgentes.length>0)setDon('urgencia','Don Urgencia',`Michi. DON URGENCIA. Tienes ${urgentes.length} cosa${urgentes.length>1?'s':''} urgente${urgentes.length>1?'s':''}. Don está sudando. Muévete.`,{bg:'#FAEEDA',border:'#FAC775',color:'#633806'});
    else if(preguntas.length>0)setDon('pendiente','Don Pendiente',`Don Pendiente tiene ${preguntas.length} pregunta${preguntas.length>1?'s':''} esperando. Don es paciente. Pero no tanto.`,{bg:'#EEEDFE',border:'#AFA9EC',color:'#3C3489'});
    else if(active.length===0)setDon('feliz','Don Feliz','¡Todo tachado! Don está tan feliz que casi ronronea. Casi.',{bg:'#FBEAF0',border:'#ED93B1',color:'#72243E'});
    else setDon('tranquilo','Don Tranquilo','Don Tranquilo reporta: todo sereno hoy. Aprovecha el día, Michi.',{bg:'#f5f4f0',border:'#e8e5e0',color:'#1a1a1a'});

    const wrap=document.createElement('div');

    // AHORA MISMO
    if(urgentes.length>0){
      const t=document.createElement('div');t.className='sec-title';
      t.innerHTML=`ahora mismo <span class="badge">${urgentes.length}</span>`;wrap.appendChild(t);
      urgentes.forEach(r=>wrap.appendChild(makeHoyCard(r,true)));
    }

    // PREGUNTAS
    if(preguntas.length>0){
      const t=document.createElement('div');t.className='sec-title';
      t.innerHTML=`te pregunto <span class="badge" id="q-badge">${preguntas.length}</span>`;wrap.appendChild(t);
      preguntas.forEach(r=>wrap.appendChild(makeHoyCard(r,false)));
    }

    // CORREOS (solo badge, al tocar va a correos)
    if(correos.length>0){
      const t=document.createElement('div');t.className='sec-title';
      t.innerHTML=`correos importantes <span class="badge">${correos.length}</span>`;wrap.appendChild(t);
      correos.forEach(r=>{
        const f=r.fields;
        const parts=(f['Título']||'').split(' — ');
        const remitente=parts.length>1?parts[0]:'';
        const asunto=parts.length>1?parts.slice(1).join(' — '):f['Título'];
        const initials=remitente?remitente.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2):'✉';
        const card=document.createElement('div');
        card.className='card';card.style.cursor='pointer';
        card.onclick=()=>{switchScreen('correos');loadCorreos();};
        card.innerHTML=`<div style="display:flex;align-items:center;gap:10px;">
          <div style="width:36px;height:36px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#3C3489;flex-shrink:0;">${initials}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:12px;font-weight:500;color:#1a1a1a;">${remitente}</div>
            <div style="font-size:13px;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${asunto}</div>
          </div>
          <div style="font-size:11px;color:#888;">→</div>
        </div>`;
        wrap.appendChild(card);
      });
    }

    // EVENTOS
    if(eventos.length>0){
      const t=document.createElement('div');t.className='sec-title';t.textContent='📍 eventos';wrap.appendChild(t);
      eventos.forEach(r=>{
        const f=r.fields;
        const card=document.createElement('div');card.className='card';
        card.style.borderLeft='3px solid #534AB7';
        card.innerHTML=`<div class="row-top"><div class="item-title">${f['Título']||''}</div>${f['Categoría']?`<span class="tag tag-${f['Categoría']}">${f['Categoría']}</span>`:''}</div>
          ${f['Descripción']?`<div class="item-desc">${f['Descripción']}</div>`:''}
          ${f['Fecha límite']?`<div style="font-size:12px;color:#534AB7;font-weight:500;">📅 ${fechaBonita(f['Fecha límite'])}</div>`:''}
          ${f['Link']?`<a href="${f['Link']}" target="_blank" style="font-size:12px;color:#534AB7;display:block;margin-top:4px;">ver detalles →</a>`:''}
          ${makeCommentBox(r.id,'Michi')}`;
        wrap.appendChild(card);
      });
    }

    // TAREAS
    if(tareas.length>0){
      const t=document.createElement('div');t.className='sec-title';t.textContent='pendientes del día';wrap.appendChild(t);
      const cardWrap=document.createElement('div');cardWrap.className='card card-tarea';
      tareas.forEach(r=>{
        const f=r.fields;
        const done=f['Estado']==='Hecho';
        const item=document.createElement('div');item.className='check-item';
        const checkEl=document.createElement('div');
        checkEl.className='check'+(done?' done':'');
        checkEl.innerHTML=done?'<div class="tick"></div>':'';
        checkEl.onclick=(e)=>{e.stopPropagation();toggleCheck(checkEl,r.id);};
        const body=document.createElement('div');body.className='check-body';
        body.innerHTML=`<div class="check-txt${done?' done':''}">${f['Título']||''}</div>
          ${f['Descripción']?`<div style="font-size:11px;color:#888;margin-top:2px;">${f['Descripción']}</div>`:''}
          ${makeCommentBox(r.id,'Michi')}`;
        item.appendChild(checkEl);item.appendChild(body);
        cardWrap.appendChild(item);
      });
      wrap.appendChild(cardWrap);
    }

    if(!wrap.children.length)wrap.innerHTML='<div class="empty-state">No hay nada por hoy. Don descansa contigo.</div>';
    container.innerHTML='';container.appendChild(wrap);
  }catch(e){container.innerHTML=`<div class="empty-state">Error: ${e.message}</div>`;}
}

function makeHoyCard(r,forUrgente){
  const f=r.fields;
  const d=r.fields['Tipo']==='Deadline'?diasRestantes(f['Fecha límite']):null;
  const card=document.createElement('div');
  card.className=forUrgente||isUrgente(d)?'card card-fire':isWarn(d)?'card card-warn':'card';

  const titleColor=forUrgente||isUrgente(d)?'color:#791F1F;':isWarn(d)?'color:#633806;':'';
  card.innerHTML=`<div class="row-top">
    <div class="item-title" style="${titleColor}">${f['Título']||''}</div>
    ${f['Categoría']?`<span class="tag tag-${f['Categoría']}">${f['Categoría']}</span>`:''}
  </div>`;

  if(f['Tipo']==='Deadline'&&d!==null){
    const col=barraColor(d);
    const pasos=getPasos(r.id);
    const done=pasos.filter(p=>p.fields['Hecho']).length;
    const pct=pasos.length>0?Math.round((done/pasos.length)*100):col.pct;
    card.innerHTML+=`<div class="deadline-row"><div class="deadline-txt">vence ${fechaBonita(f['Fecha límite'])}</div><div class="deadline-dias ${col.text}">${diasLabel(d)}</div></div>
      <div class="barra-bg"><div class="barra-fill ${pct===100?'b-ok':col.bar}" id="barra-${r.id}" style="width:${Math.max(3,pct)}%"></div></div>`;
    card.style.cursor='pointer';
    card.onclick=()=>{switchScreen('deadlines');loadDeadlines();};
    card.innerHTML+=`<div style="font-size:11px;color:#888;margin-top:2px;">toca para ver detalles →</div>`;
  } else {
    if(f['Descripción'])card.innerHTML+=`<div class="item-desc" style="${titleColor}">${f['Descripción']}</div>`;
    if(f['Respuesta de Michi']){
      card.innerHTML+=`<div class="responded-row"><span class="responded-tag">✓ ${f['Respuesta de Michi']}</span><span class="cambiar-btn" onclick="deshacerResp('${r.id}',this)">cambiar</span></div>`;
    } else {
      card.innerHTML+=`<div class="btn-row"><div class="btn btn-si" onclick="respondBtn(this,'${r.id}','sí')">sí</div><div class="btn btn-no" onclick="respondBtn(this,'${r.id}','no')">no</div><div class="btn" onclick="respondBtn(this,'${r.id}','después')">después</div></div>`;
    }
    card.innerHTML+=makeCommentBox(r.id,'Michi');
  }
  return card;
}

async function toggleCheck(el,recordId){
  const isDone=el.classList.contains('done');
  el.classList.toggle('done',!isDone);
  el.innerHTML=!isDone?'<div class="tick"></div>':'';
  const txt=el.closest('.check-item').querySelector('.check-txt');
  if(txt)txt.classList.toggle('done',!isDone);
  await apiPatch('Tareas',recordId,{'Estado':!isDone?'Hecho':'Pendiente'});
}

// ── Load DEADLINES ────────────────────────────────────────────────────────────
async function loadDeadlines(){
  const container=document.getElementById('deadlines-container');
  container.innerHTML='<div class="big-spinner"></div>';
  try{
    await Promise.all([loadAllComments(),loadAllPasos()]);
    const data=await api(`Tareas?filterByFormula=%7BTipo%7D%3D%22Deadline%22&sort%5B0%5D%5Bfield%5D=Orden&sort%5B0%5D%5Bdirection%5D=asc`);
    const records=(data.records||[]).filter(r=>r.fields['Estado']!=='Hecho')
      .sort((a,b)=>(diasRestantes(a.fields['Fecha límite'])??999)-(diasRestantes(b.fields['Fecha límite'])??999));
    if(!records.length){container.innerHTML='<div class="empty-state">No hay deadlines activos. Don tranquilo.</div>';return;}
    const wrap=document.createElement('div');
    records.forEach(r=>{
      const f=r.fields;
      const d=diasRestantes(f['Fecha límite']);
      const col=d!==null?barraColor(d):{bar:'b-ok',text:'d-ok',pct:50};
      const cc=isUrgente(d)?'card card-fire':isWarn(d)?'card card-warn':'card';
      const titleColor=isUrgente(d)?'color:#791F1F;':isWarn(d)?'color:#633806;':'';

      const card=document.createElement('div');card.className=cc;
      const pasos=getPasos(r.id);
      const doneCount=pasos.filter(p=>p.fields['Hecho']).length;
      const pct=pasos.length>0?Math.round((doneCount/pasos.length)*100):col.pct;

      card.innerHTML=`<div class="row-top"><div class="item-title" style="${titleColor}">${f['Título']||''}</div>${f['Categoría']?`<span class="tag tag-${f['Categoría']}">${f['Categoría']}</span>`:''}</div>
        ${d!==null?`<div class="deadline-row"><div class="deadline-txt">vence ${fechaBonita(f['Fecha límite'])}</div><div class="deadline-dias ${col.text}">${diasLabel(d)}</div></div>
        <div class="barra-bg"><div class="barra-fill ${pct===100?'b-ok':col.bar}" id="barra-${r.id}" style="width:${Math.max(3,pct)}%"></div></div>`:''}`;

      // Toggle details
      const toggleBtn=document.createElement('div');
      toggleBtn.className='thread-toggle';
      toggleBtn.onclick=(e)=>{e.stopPropagation();toggleDet(r.id);};
      toggleBtn.innerHTML=`<span id="dl-${r.id}">ver pasos y detalles</span>`;
      card.appendChild(toggleBtn);

      const detBody=document.createElement('div');
      detBody.className='thread-body';detBody.id='det-'+r.id;
      if(f['Descripción']){const desc=document.createElement('div');desc.className='item-desc';desc.style.cssText=titleColor+'margin-bottom:8px;';desc.textContent=f['Descripción'];detBody.appendChild(desc);}
      if(f['Link']){detBody.innerHTML+=`<a href="${f['Link']}" target="_blank" style="font-size:12px;color:#534AB7;display:block;margin-bottom:8px;">ver enlace →</a>`;}

      const pasosWrap=document.createElement('div');
      pasosWrap.setAttribute('data-tarea-pasos',r.id);
      pasosWrap.innerHTML=makePasosHtml(r.id,true);
      detBody.appendChild(pasosWrap);

      // Mark as done
      const doneRow=document.createElement('div');
      doneRow.style.cssText='display:flex;justify-content:flex-end;margin-top:8px;';
      doneRow.innerHTML=`<span onclick="marcarDeadlineHecho('${r.id}',this);event.stopPropagation();" class="done-btn">✓ marcar como hecho</span>`;
      detBody.appendChild(doneRow);
      card.appendChild(detBody);

      // Comments
      const commBox=document.createElement('div');
      commBox.innerHTML=makeCommentBox(r.id,'Michi');
      card.appendChild(commBox);
      wrap.appendChild(card);
    });
    container.innerHTML='';container.appendChild(wrap);
    document.getElementById('notif-deadlines').style.display='none';
  }catch(e){container.innerHTML=`<div class="empty-state">Error: ${e.message}</div>`;}
}

function toggleDet(id){
  const body=document.getElementById('det-'+id);
  const label=document.getElementById('dl-'+id);
  if(!body)return;
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open');
  if(label)label.textContent=isOpen?'ver pasos y detalles':'cerrar detalles';
}

        const initials=remitente?remitente.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2):'✉';
        const card=document.createElement('div');card.className='card';card.style.opacity='0.6';
        card.innerHTML=`<div style="display:flex;align-items:center;gap:10px;"><div style="width:32px;height:32px;border-radius:50%;background:#f5f4f0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#888;">${initials}</div><div style="flex:1;min-width:0;"><div style="font-size:12px;font-weight:500;color:#888;">${remitente}</div><div style="font-size:12px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${asunto}</div></div><span style="font-size:10px;color:#1D9E75;flex-shrink:0;">✓ ${f['Respuesta de Michi']||'visto'}</span></div>`;
        wrap.appendChild(card);
      });
    }
    container.innerHTML='';container.appendChild(wrap);
    document.getElementById('notif-correos').style.display='none';
  }catch(e){container.innerHTML=`<div class="empty-state">Error: ${e.message}</div>`;}
}

function toggleDesc(id){
  const el=document.getElementById('desc-'+id);const btn=document.getElementById('vmas-'+id);
  if(!el||!btn)return;
  const collapsed=el.style.webkitLineClamp!=='unset';
  el.style.webkitLineClamp=collapsed?'unset':'3';
  el.style.display=collapsed?'block':'-webkit-box';
  btn.textContent=collapsed?'ver menos':'ver más';
}

// ── Load HISTORIAL ────────────────────────────────────────────────────────────
async function loadHistorial(){
  const container=document.getElementById('historial-container');
  container.innerHTML='<div class="big-spinner"></div>';
  try{
    const data=await api(`Tareas?filterByFormula=%7BEstado%7D%3D%22Hecho%22`);
    const records=data.records||[];
    if(!records.length){container.innerHTML='<div class="empty-state">Nada completado todavía.</div>';return;}
    const wrap=document.createElement('div');
    records.forEach(r=>{
      const f=r.fields;
      const card=document.createElement('div');card.className='card';card.style.opacity='0.7';
      card.innerHTML=`<div class="row-top"><div class="item-title" style="text-decoration:line-through;color:#888;">${f['Título']||''}</div>${f['Categoría']?`<span class="tag tag-${f['Categoría']}">${f['Categoría']}</span>`:''}</div><div style="font-size:11px;color:#1D9E75;margin-top:4px;">✓ ${f['Respuesta de Michi']||'completado'}</div>`;
      wrap.appendChild(card);
    });
    container.innerHTML='';container.appendChild(wrap);
  }catch(e){container.innerHTML=`<div class="empty-state">Error: ${e.message}</div>`;}
}

// ── Navigation ────────────────────────────────────────────────────────────────
const screenHistory=['hoy'];
window.addEventListener('popstate',()=>{
  if(screenHistory.length>1){screenHistory.pop();const prev=screenHistory[screenHistory.length-1];
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.nav-it').forEach(n=>n.classList.remove('active'));
    document.getElementById('screen-'+prev).classList.add('active');
    document.getElementById('nav-'+prev).classList.add('active');
    history.pushState(null,'',window.location.href);}
});
history.pushState(null,'',window.location.href);

function switchScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-it').forEach(n=>n.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  window.scrollTo(0,0);
  const greetings={hoy:'buenos días',deadlines:'tus fechas límite',correos:'correos importantes',historial:'historial'};
  document.getElementById('top-greeting').textContent=greetings[name]||'';
  if(name==='hoy')document.getElementById('notif-hoy').style.display='none';
  screenHistory.push(name);history.pushState(null,'',window.location.href);
}

// ── Auto-refresh (only when at top, not typing) ───────────────────────────────
loadHoy();
setInterval(()=>{
  const focused=document.activeElement;
  if(focused&&(focused.tagName==='INPUT'||focused.tagName==='TEXTAREA'))return;
  if(window.scrollY>100)return;
  const active=document.querySelector('.screen.active');if(!active)return;
  const id=active.id;
  if(id==='screen-hoy')loadHoy();
  else if(id==='screen-deadlines')loadDeadlines();
  else if(id==='screen-correos')loadCorreos();
},30000);

// Notif dots
setTimeout(async()=>{
  try{const d=await api(`Tareas?filterByFormula=%7BTipo%7D%3D%22Deadline%22`);
  const u=(d.records||[]).filter(r=>{const dx=diasRestantes(r.fields['Fecha límite']);return dx!==null&&dx<=3&&r.fields['Estado']!=='Hecho';});
  if(u.length>0)document.getElementById('notif-deadlines').style.display='block';}catch(e){}
},1000);
setTimeout(async()=>{
  try{const d=await api(`Tareas?filterByFormula=AND(%7BTipo%7D%3D%22Correo%22%2CNOT(%7BEstado%7D%3D%22Hecho%22))`);
  if((d.records||[]).length>0)document.getElementById('notif-correos').style.display='block';}catch(e){}
},1500);
</script>
