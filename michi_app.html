<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f4f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; min-height: 100vh; }
@media (min-width: 768px) {
  body { background: #ece9e3; align-items: flex-start; padding: 24px; }
  .app { max-width: 420px; background: #f5f4f0; border-radius: 24px; box-shadow: 0 8px 40px rgba(0,0,0,0.10); min-height: calc(100vh - 48px); }
  .nav { border-radius: 0 0 24px 24px; max-width: 420px; }
}
.app { max-width: 390px; width: 100%; padding: 16px 16px 90px; }
.header { text-align: center; padding: 20px 0 12px; }
.greeting { font-size: 12px; color: #888; letter-spacing: 0.05em; }
.name { font-size: 24px; font-weight: 500; color: #1a1a1a; margin: 4px 0 2px; }
.date-line { font-size: 12px; color: #888; }
.don-row { display: flex; align-items: flex-end; gap: 10px; margin: 12px 0 8px; }
.don-name { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; margin-bottom: 4px; }
.bubble { border-radius: 14px 14px 14px 2px; padding: 11px 14px; font-size: 13px; line-height: 1.55; flex: 1; }
.sec-title { font-size: 10px; font-weight: 500; color: #888; letter-spacing: 0.07em; text-transform: uppercase; margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; }
.badge { font-size: 10px; background: #D4537E; color: white; padding: 1px 7px; border-radius: 10px; }
.badge-ok { background: #1D9E75; }
.card { background: white; border: 0.5px solid #e8e5e0; border-radius: 16px; padding: 14px 15px; margin-bottom: 10px; }
.card-fire { border-color: #F09595 !important; background: #FCEBEB !important; }
.card-warn { border-color: #FAC775 !important; background: #FAEEDA !important; }
.row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 5px; }
.item-title { font-size: 14px; font-weight: 500; color: #1a1a1a; flex: 1; line-height: 1.4; }
.item-desc { font-size: 12px; color: #888; line-height: 1.5; margin-bottom: 8px; }
.item-desc-collapsed { font-size: 12px; color: #888; line-height: 1.5; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ver-mas { font-size: 11px; color: #534AB7; cursor: pointer; margin-bottom: 8px; display: inline-block; }
.tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
.tag-Investigación,.tag-investigación{background:#EEEDFE;color:#3C3489;}
.tag-Docencia,.tag-docencia{background:#E6F1FB;color:#0C447C;}
.tag-Salud,.tag-salud{background:#EAF3DE;color:#3B6D11;}
.tag-Personal,.tag-personal{background:#FBEAF0;color:#72243E;}
.tag-Admin,.tag-admin{background:#F1EFE8;color:#444;}
.tag-Asesorados,.tag-asesorados{background:#FFF3E0;color:#7B4800;}
.deadline-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
.deadline-txt { font-size: 11px; color: #888; }
.deadline-dias { font-size: 11px; font-weight: 500; }
.d-fire{color:#A32D2D;} .d-warn{color:#854F0B;} .d-ok{color:#085041;}
.barra-bg { height: 5px; background: rgba(0,0,0,0.07); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.barra-fill { height: 100%; border-radius: 3px; }
.b-fire{background:#E24B4A;} .b-warn{background:#EF9F27;} .b-ok{background:#1D9E75;}
.pasos-row { display: flex; align-items: center; gap: 2px; margin-bottom: 10px; }
.paso-g { display: flex; flex-direction: column; align-items: center; gap: 3px; }

.paso-c.hecho { background: #1D9E75; border-color: #1D9E75; color: white; }
.paso-c.activo { border-color: #EF9F27; color: #854F0B; font-weight: 600; }
.paso-t { font-size: 9px; color: #888; max-width: 52px; text-align: center; line-height: 1.3; }
.paso-linea { flex: 1; height: 1px; background: #e8e5e0; min-width: 6px; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

.btn-no{background:#FCEBEB;border-color:#F09595;color:#791F1F;}
.responded-tag { font-size: 11px; color: #085041; background: #E1F5EE; padding: 4px 12px; border-radius: 10px; display: inline-block; margin-top: 6px; }
.check-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid #f0ede8; }
.check-item:last-child { border-bottom: none; padding-bottom: 2px; }
.check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #ccc; flex-shrink: 0; margin-top: 2px; cursor: pointer; }
.check.done { background: #1D9E75; border-color: #1D9E75; display: flex; align-items: center; justify-content: center; }
.tick { width: 7px; height: 4px; border-left: 1.5px solid white; border-bottom: 1.5px solid white; transform: rotate(-45deg) translateY(-1px); }
.check-body { flex: 1; }
.check-txt { font-size: 13px; color: #1a1a1a; line-height: 1.4; }
.check-txt.done { color: #aaa; text-decoration: line-through; }
.thread-toggle { font-size: 11px; color: #888; cursor: pointer; display: flex; align-items: center; gap: 4px; margin-top: 6px; padding: 2px 0; user-select: none; }
.thread-toggle:hover { color: #534AB7; }
.thread-body { display: none; margin-top: 4px; }
.thread-body.open { display: block; }
.thread-dot { width: 6px; height: 6px; border-radius: 50%; background: #D4537E; display: inline-block; margin-left: 3px; vertical-align: middle; }
.convo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.msg-a .msg-bub { background: #f5f4f0; border: 0.5px solid #e8e5e0; border-radius: 10px 10px 10px 2px; padding: 6px 10px; font-size: 11px; color: #888; display: inline-block; max-width: 90%; line-height: 1.4; }
.msg-m { display: flex; justify-content: flex-end; }
.msg-m .msg-bub { background: #EEEDFE; border: 0.5px solid #AFA9EC; border-radius: 10px 10px 2px 10px; padding: 6px 10px; font-size: 11px; color: #3C3489; display: inline-block; max-width: 90%; line-height: 1.4; }
.add-comment { margin-top: 4px; display: flex; gap: 5px; align-items: center; }
.comment-input { flex: 1; font-size: 11px; padding: 4px 9px; border-radius: 12px; border: 0.5px solid #e0ddd8; background: #f9f8f5; color: #1a1a1a; outline: none; font-family: inherit; height: 26px; }
.comment-input::placeholder { color: #bbb; }
.send-btn { width: 24px; height: 24px; border-radius: 50%; background: #534AB7; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cat-mini { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.cat-label { font-size: 11px; color: #888; }
.loading-state,.empty-state { text-align: center; padding: 40px 20px; color: #888; font-size: 13px; }
.screen { display: none; }
.screen.active { display: block; }
.nav { display: flex; justify-content: space-around; padding: 12px 0 6px; border-top: 0.5px solid #e8e5e0; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; background: #f5f4f0; }
.nav-it { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 12px; position: relative; }
.nav-lbl { font-size: 10px; color: #888; }
.nav-it.active .nav-lbl { color: #1a1a1a; font-weight: 500; }
.notif-dot { width: 7px; height: 7px; border-radius: 50%; background: #D4537E; position: absolute; top: 0; right: 8px; display: none; }
.big-spinner { width: 28px; height: 28px; border: 2px solid #e8e5e0; border-top-color: #534AB7; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
const TOKEN = 'patMCJ3Vrz8Uw32sO.9288ac142ac8780a9b1f02c10300158c138699ee85b4c11e1ee267d892161426';
const BASE_ID = 'appz6fdbkJTA1S0GW';
const diasN = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const mesesN = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const hoy = new Date(); hoy.setHours(0,0,0,0);
document.getElementById('top-date').textContent = `${diasN[hoy.getDay()]} ${hoy.getDate()} de ${mesesN[hoy.getMonth()]}`;

async function api(path) {
  const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${path}`, { headers: { 'Authorization': `Bearer ${TOKEN}` } });
  return res.json();
}
async function apiPost(table, fields) {
  const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${table}`, { method:'POST', headers:{'Authorization':`Bearer ${TOKEN}`,'Content-Type':'application/json'}, body:JSON.stringify({fields}) });
  return res.json();
}
async function apiPatch(table, id, fields) {
  const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${table}/${id}`, { method:'PATCH', headers:{'Authorization':`Bearer ${TOKEN}`,'Content-Type':'application/json'}, body:JSON.stringify({fields}) });
  return res.json();
}

function diasRestantes(f) {
  if (!f) return null;
  const fecha = new Date(f); fecha.setHours(0,0,0,0);
  return Math.ceil((fecha - hoy) / 86400000);
}
function fechaBonita(f) {
  if (!f) return '';
  const d = new Date(f);
  return `${diasN[d.getDay()]} ${d.getDate()} de ${mesesN[d.getMonth()]}`;
}
function barraColor(d) {
  if (d<=0) return {bar:'b-fire',text:'d-fire',pct:3};
  if (d<=1) return {bar:'b-fire',text:'d-fire',pct:5};
  if (d<=7) return {bar:'b-warn',text:'d-warn',pct:Math.min(35,d*5)};
  return {bar:'b-ok',text:'d-ok',pct:Math.min(90,d*2)};
}
function diasLabel(d) {
  if (d===null) return '';
  if (d<0) return `venció hace ${Math.abs(d)} día${Math.abs(d)>1?'s':''}`;
  if (d===0) return 'vence hoy';
  if (d===1) return 'mañana';
  return `${d} días`;
}
function isUrgente(d) { return d !== null && d <= 1; }
function isWarn(d) { return d !== null && d > 1 && d <= 7; }

function donSVG(mode) {
  const base = `<path d="M18 56 Q18 24 30 15 L33 30 Q38 26 50 26 Q62 26 67 30 L70 15 Q82 24 82 56 Q82 78 50 80 Q18 78 18 56Z" fill="#1a1a1a"/><path d="M30 15 L33 30 Q30 23 25 19Z" fill="#1a1a1a"/><path d="M70 15 L67 30 Q70 23 75 19Z" fill="#1a1a1a"/>`;
  if (mode==='urgencia') return base+`<circle cx="35" cy="52" r="14" fill="white"/><circle cx="65" cy="52" r="14" fill="white"/><circle cx="35" cy="52" r="10" fill="#55cc44"/><circle cx="65" cy="52" r="10" fill="#55cc44"/><circle cx="35" cy="52" r="6" fill="#1a1a1a"/><circle cx="65" cy="52" r="6" fill="#1a1a1a"/><circle cx="38" cy="47" r="3.5" fill="white"/><circle cx="68" cy="47" r="3.5" fill="white"/><path d="M43 70 L50 63 L57 70" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M77 18 Q79 10 82 9 Q85 11 83 18 Q81 23 77 20Z" fill="#6ec6f5"/><path d="M83 32 Q86 24 89 24 Q91 27 89 33 Q87 38 83 35Z" fill="#6ec6f5"/><path d="M23 18 Q21 10 18 9 Q15 11 17 18 Q19 23 23 20Z" fill="#6ec6f5"/><path d="M17 32 Q14 24 11 24 Q9 27 11 33 Q13 38 17 35Z" fill="#6ec6f5"/>`;
  if (mode==='pendiente') return base+`<line x1="24" y1="51" x2="44" y2="51" stroke="white" stroke-width="3" stroke-linecap="round"/><line x1="56" y1="51" x2="76" y2="51" stroke="white" stroke-width="3" stroke-linecap="round"/><ellipse cx="50" cy="65" rx="5" ry="3.5" fill="white"/><path d="M50 68 Q50 76 50 78" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round"/><ellipse cx="50" cy="80" rx="3.5" ry="2.5" fill="white" opacity="0.9"/><circle cx="8" cy="55" r="5.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="9" cy="41" r="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="10" cy="30" r="2.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>`;
  if (mode==='feliz') return base+`<clipPath id="cl"><rect x="22" y="40" width="24" height="12"/></clipPath><circle cx="34" cy="51" r="11" fill="#55cc44" clip-path="url(#cl)"/><circle cx="34" cy="51" r="7" fill="#1a1a1a" clip-path="url(#cl)"/><circle cx="37" cy="47" r="3" fill="white" clip-path="url(#cl)"/><clipPath id="cr"><rect x="54" y="40" width="24" height="12"/></clipPath><circle cx="66" cy="51" r="11" fill="#55cc44" clip-path="url(#cr)"/><circle cx="66" cy="51" r="7" fill="#1a1a1a" clip-path="url(#cr)"/><circle cx="69" cy="47" r="3" fill="white" clip-path="url(#cr)"/><path d="M43 63 Q50 68 57 63" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M43 63 Q50 69 57 63" fill="white"/>`;
  return base+`<circle cx="35" cy="52" r="9" fill="#55cc44"/><circle cx="65" cy="52" r="9" fill="#55cc44"/><circle cx="35" cy="52" r="5" fill="#1a1a1a"/><circle cx="65" cy="52" r="5" fill="#1a1a1a"/><circle cx="37" cy="49" r="2.5" fill="white"/><circle cx="67" cy="49" r="2.5" fill="white"/>`;

async function loadThreadComments(recordId, convoEl) {
  try {
    const data = await api(`Comentarios?maxRecords=100`);
    convoEl.innerHTML = '';
    const filtered = (data.records||[]).filter(r => {
      const t = r.fields['Tarea'];
      if (!t) return false;
      if (Array.isArray(t)) return t.includes(recordId);
      return t === recordId;
    }).sort((a,b) => new Date(a.createdTime)-new Date(b.createdTime));

    filtered.forEach(r => {
      const div = document.createElement('div');
      div.className = r.fields['De']==='Michi' ? 'msg-m' : 'msg-a';
      div.innerHTML = `<div class="msg-bub">${r.fields['Comentario']||''}</div>`;
      convoEl.appendChild(div);
    });

    const preview = document.getElementById('preview-'+recordId);
    const label = document.getElementById('label-'+recordId);
    if (filtered.length > 0) {
      const last = filtered[filtered.length-1];
      const lastDe = last.fields['De'];
      const lastText = last.fields['Comentario']||'';
      const isNew = lastDe === 'Asistente';
      if (preview) {
        preview.style.display = 'flex';
        const bubStyle = lastDe==='Michi'
          ? 'background:#EEEDFE;border:0.5px solid #AFA9EC;border-radius:10px 10px 2px 10px;color:#3C3489;'
          : 'background:#f5f4f0;border:0.5px solid #e8e5e0;border-radius:10px 10px 10px 2px;color:#888;';
        preview.innerHTML = `<div style="font-size:11px;padding:6px 10px;${bubStyle}max-width:88%;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${lastText}</div>${isNew?'<span class="thread-dot" style="margin-left:4px;align-self:center;"></span>':''}`;
      }
      if (label) label.innerHTML = 'ver más mensajes'+(isNew?'<span class="thread-dot"></span>':'');
    } else {
      if (preview) preview.style.display = 'none';
      if (label) label.textContent = '💬 comentar';
    }
  } catch(e) {}
}

function makeCommentBox(recordId, quien) {
  return `
  <div id="preview-${recordId}" style="display:none;margin-top:6px;cursor:pointer;" onclick="event.stopPropagation();toggleThread('${recordId}')"></div>
  <div class="thread-toggle" onclick="event.stopPropagation();toggleThread('${recordId}')">
    <span id="label-${recordId}">💬 comentar</span>
  </div>
  <div class="thread-body" id="thread-body-${recordId}">
    <div class="convo" id="convo-${recordId}"></div>
    <div class="add-comment" data-record-id="${recordId}" style="margin-top:4px;">
      <input class="comment-input" placeholder="comenta algo..." onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter'){event.stopPropagation();sendThreadComment(this,'${quien}');}"/>
      <button class="send-btn" onclick="event.stopPropagation();sendThreadComment(this.previousElementSibling,'${quien}');">${sendIcon()}</button>
    </div>
  </div>`;
}

function toggleThread(recordId) {
  const body = document.getElementById('thread-body-'+recordId);
  const preview = document.getElementById('preview-'+recordId);
  const label = document.getElementById('label-'+recordId);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  if (preview) preview.style.display = isOpen ? 'flex' : 'none';
  if (label) label.textContent = isOpen ? 'ver más mensajes' : 'cerrar conversación';
}

async function sendThreadComment(inputEl, quien) {
  const text = inputEl.value.trim();
  if (!text) return;
  const recordId = inputEl.closest('.add-comment').dataset.recordId;
  inputEl.value = '';
  const convoEl = document.getElementById('convo-'+recordId);
  const div = document.createElement('div');
  div.className = quien==='Michi' ? 'msg-m' : 'msg-a';
  div.innerHTML = `<div class="msg-bub">${text}</div>`;
  if (convoEl) convoEl.appendChild(div);
  await apiPost('Comentarios', {'Comentario':text,'Tarea':[recordId],'De':quien});
  if (quien==='Michi') await apiPatch('Tareas', recordId, {'Respuesta de Michi':text});
}

async function respondBtn(btn, recordId, valor) {
  event.stopPropagation();
  const row = btn.closest('.btn-row');
  row.innerHTML = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span class="responded-tag">✓ ${valor}</span>
    <span onclick="deshacerRespuesta('${recordId}',this);event.stopPropagation();" style="font-size:11px;color:#888;cursor:pointer;text-decoration:underline;">cambiar</span>
  </div>`;
  await apiPatch('Tareas', recordId, {'Respuesta de Michi':valor,'Estado':'Hecho'});
  const badge = document.getElementById('q-badge');
  if (badge) { let n=Math.max(0,parseInt(badge.textContent)-1); badge.textContent=n; if(n===0) badge.classList.add('badge-ok'); }
}

async function deshacerRespuesta(recordId, el) {
  const wrap = el.parentElement;
  const originalBtns = wrap.closest('[id]');
  wrap.innerHTML = `<div class="btn-row"><div class="btn btn-si" onclick="respondBtn(this,'${recordId}','sí')">sí</div><div class="btn btn-no" onclick="respondBtn(this,'${recordId}','no')">no</div><div class="btn" onclick="respondBtn(this,'${recordId}','después')">después</div></div>`;
  await apiPatch('Tareas', recordId, {'Respuesta de Michi': '', 'Estado': 'Pendiente'});
}

async function toggleCheck(el, recordId) {
  const check = el.querySelector('.check');
  const txt = el.querySelector('.check-txt');
  const isDone = check.classList.contains('done');
  if (isDone) { check.classList.remove('done'); check.innerHTML=''; txt.classList.remove('done'); await apiPatch('Tareas',recordId,{'Estado':'Pendiente'}); }
  else { check.classList.add('done'); check.innerHTML='<div class="tick"></div>'; txt.classList.add('done'); await apiPatch('Tareas',recordId,{'Estado':'Hecho'}); }
}

function makeDeadlineCard(r, forHoy) {
  const f = r.fields;
  const d = diasRestantes(f['Fecha límite']);
  const col = d!==null ? barraColor(d) : {bar:'b-ok',text:'d-ok',pct:50};
  const cc = isUrgente(d) ? 'card card-fire' : isWarn(d) ? 'card card-warn' : 'card';
  const titleColor = isUrgente(d) ? 'color:#791F1F;' : isWarn(d) ? 'color:#633806;' : '';

  const card = document.createElement('div');
  card.className = cc;

  // Always visible: title + bar
  let html = `<div class="row-top">
    <div class="item-title" style="${titleColor}">${f['Título']||''}</div>
    ${f['Categoría']?`<span class="tag tag-${f['Categoría']}">${f['Categoría']}</span>`:''}
  </div>`;

  if (d !== null) {
    html += `<div class="deadline-row">
      <div class="deadline-txt">vence ${fechaBonita(f['Fecha límite'])}</div>
      <div class="deadline-dias ${col.text}">${diasLabel(d)}</div>
    </div>
    <div class="barra-bg"><div class="barra-fill ${col.bar}" style="width:${col.pct}%"></div></div>`;
  }

  card.innerHTML = html;

  // If forHoy: clicking goes to deadlines tab
  if (forHoy) {
    card.style.cursor = 'pointer';
    card.onclick = () => { switchScreen('deadlines'); loadDeadlines(); };

    // Mini pasos bar (just dots)
    const miniPasos = document.createElement('div');
    miniPasos.id = 'mini-pasos-'+r.id;
    miniPasos.style.marginBottom = '4px';
    card.appendChild(miniPasos);
    loadMiniPasos(r.id, miniPasos);
    card.innerHTML += `<div style="font-size:11px;color:#888;margin-top:2px;">toca para ver detalles →</div>`;
    return card;
  }

  // Full view: collapsible details
  const toggleBtn = document.createElement('div');
  toggleBtn.className = 'thread-toggle';
  toggleBtn.onclick = (e) => { e.stopPropagation(); toggleDetails(r.id); };
  toggleBtn.innerHTML = `<span id="det-label-${r.id}">ver pasos y detalles</span>`;
  card.appendChild(toggleBtn);

  const detBody = document.createElement('div');
  detBody.className = 'thread-body';
  detBody.id = 'det-body-'+r.id;

  if (f['Descripción']) {
    const desc = document.createElement('div');
    desc.className = 'item-desc';
    desc.style.cssText = isUrgente(d)?'color:#A32D2D;margin-bottom:8px;':isWarn(d)?'color:#854F0B;margin-bottom:8px;':'margin-bottom:8px;';
    desc.textContent = f['Descripción'];
    detBody.appendChild(desc);
  }

  if (f['Link']) {
    detBody.innerHTML += `<a href="${f['Link']}" target="_blank" style="font-size:12px;color:#534AB7;display:block;margin-bottom:8px;">ver enlace →</a>`;
  }

  const pasosWrap = document.createElement('div');
  pasosWrap.id = 'pasos-'+r.id;
  pasosWrap.style.marginBottom = '8px';
  detBody.appendChild(pasosWrap);
  card.appendChild(detBody);

  // Load pasos with click to mark done
  loadPasos(r.id, pasosWrap, true);

  // Mark as done button for Michi
  if (!forHoy) {
    const doneWrap = document.createElement('div');
    doneWrap.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:0.5px solid #f0ede8;';
    const isDone = f['Estado'] === 'Hecho';
    doneWrap.innerHTML = isDone
      ? `<span style="font-size:12px;color:#1D9E75;font-weight:500;">✓ completado</span>
         <span onclick="marcarDeadlinePendiente('${r.id}',this);event.stopPropagation();" style="font-size:11px;color:#888;cursor:pointer;text-decoration:underline;">deshacer</span>`
      : `<span style="font-size:11px;color:#888;">¿Lo terminaste?</span>
         <span onclick="marcarDeadlineHecho('${r.id}',this);event.stopPropagation();" style="font-size:12px;cursor:pointer;background:#E1F5EE;color:#085041;padding:5px 12px;border-radius:12px;border:0.5px solid #5DCAA5;">✓ marcar como hecho</span>`;
    card.appendChild(doneWrap);
  }

  const commentBox = document.createElement('div');
  commentBox.innerHTML = makeCommentBox(r.id, 'Michi');
  card.appendChild(commentBox);

  return card;
}

  loadDeadlines();
}

async function marcarDeadlinePendiente(recordId, btn) {

}

async function loadMiniPasos(tareaId, container) {
  try {
    const data = await api(`Pasos?maxRecords=20`);
    const pasos = (data.records||[]).filter(r => {
      const t = r.fields['Tarea'];
      return Array.isArray(t) && t.includes(tareaId);
    }).sort((a,b)=>(a.fields['Orden']||0)-(b.fields['Orden']||0));
    if (!pasos.length) return;
    const row = document.createElement('div');
    row.className = 'pasos-row';
    pasos.forEach((p,i) => {
      const hecho = p.fields['Hecho'];
      const cls = hecho?'hecho':i===0||pasos.slice(0,i).every(x=>x.fields['Hecho'])?'activo':'';
      const g = document.createElement('div'); g.className='paso-g';
      g.innerHTML=`<div class="paso-c ${cls}" style="width:16px;height:16px;font-size:8px;">${hecho?'✓':(i+1)}</div>`;
      row.appendChild(g);
      if(i<pasos.length-1){const l=document.createElement('div');l.className='paso-linea';row.appendChild(l);}
    });
    container.appendChild(row);
  } catch(e){}
}

function toggleDetails(recordId) {
  const body = document.getElementById('det-body-'+recordId);
  const label = document.getElementById('det-label-'+recordId);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  if (label) label.textContent = isOpen ? 'ver pasos y detalles' : 'cerrar detalles';
}

async function loadPasos(tareaId, container, clickable) {
  try {
    const data = await api(`Pasos?maxRecords=20`);
    const pasos = (data.records||[]).filter(r => {
      const t = r.fields['Tarea'];
      return Array.isArray(t) && t.includes(tareaId);
    }).sort((a,b) => (a.fields['Orden']||0)-(b.fields['Orden']||0));

    if (!pasos.length) return;

    const row = document.createElement('div');
    row.className = 'pasos-row';
    row.id = 'pasos-row-' + tareaId;

    pasos.forEach((p, i) => {
      const hecho = p.fields['Hecho'];
      const cls = hecho ? 'hecho' : i===0||pasos.slice(0,i).every(x=>x.fields['Hecho']) ? 'activo' : '';
      const g = document.createElement('div'); g.className = 'paso-g';
      const c = document.createElement('div');
      c.className = `paso-c ${cls}`;
      c.textContent = hecho ? '✓' : (i+1);
      if (clickable) {
        c.style.cursor = 'pointer';
        c.onclick = async (e) => {
          e.stopPropagation();
          const isDone = c.classList.contains('hecho');
          c.classList.toggle('hecho', !isDone);
          c.textContent = !isDone ? '✓' : (i+1);
          await apiPatch('Pasos', p.id, {'Hecho': !isDone});
          // Reload to update activo state
          setTimeout(() => { container.innerHTML=''; loadPasos(tareaId, container, true); }, 300);
        };
      }
      const t = document.createElement('div'); t.className = 'paso-t'; t.textContent = p.fields['Paso']||'';
      g.appendChild(c); g.appendChild(t); row.appendChild(g);
      if (i < pasos.length-1) { const l=document.createElement('div'); l.className='paso-linea'; row.appendChild(l); }
    });
    container.appendChild(row);
  } catch(e) {}
}

async function loadHoy() {
  const container = document.getElementById('hoy-container');
  try {
    const data = await api(`Tareas?sort%5B0%5D%5Bfield%5D=Urgente&sort%5B0%5D%5Bdirection%5D=desc`);
    const records = data.records||[];

    // Deadlines urgentes (vencen hoy, mañana o ya vencieron)
    const deadlinesUrgentes = records.filter(r => {
      if (r.fields['Tipo'] !== 'Deadline') return false;
      const d = diasRestantes(r.fields['Fecha límite']);
      return d !== null && d <= 1;
    });

    const urgentes = records.filter(r => r.fields['Urgente'] && r.fields['Estado']!=='Hecho' && r.fields['Tipo']!=='Deadline');
    const todasUrgentes = [...urgentes, ...deadlinesUrgentes];
    const preguntas = records.filter(r => r.fields['Tipo']==='Pregunta' && r.fields['Estado']!=='Hecho');
    const correos = records.filter(r => r.fields['Tipo']==='Correo' && r.fields['Estado']!=='Hecho');
    const tareas = records.filter(r => r.fields['Tipo']==='Tarea' && !r.fields['Urgente']);
    const eventos = records.filter(r => r.fields['Tipo']==='Evento' && r.fields['Estado']!=='Hecho');

    if (todasUrgentes.length > 0) setDon('urgencia','Don Urgencia',`Michi. DON URGENCIA. Tienes ${todasUrgentes.length} cosa${todasUrgentes.length>1?'s':''} urgente${todasUrgentes.length>1?'s':''}. Don está sudando. Muévete.`,{bg:'#FAEEDA',border:'#FAC775',color:'#633806'});
    else if (preguntas.length > 0) setDon('pendiente','Don Pendiente',`Don Pendiente tiene ${preguntas.length} pregunta${preguntas.length>1?'s':''} esperando. Don es paciente. Pero no tanto.`,{bg:'#EEEDFE',border:'#AFA9EC',color:'#3C3489'});
    else if (records.filter(r=>r.fields['Estado']!=='Hecho').length===0) setDon('feliz','Don Feliz','¡Todo tachado! Don está tan feliz que casi ronronea. Casi.',{bg:'#FBEAF0',border:'#ED93B1',color:'#72243E'});
    else setDon('tranquilo','Don Tranquilo','Don Tranquilo reporta: todo sereno hoy. Aprovecha el día, Michi.',{bg:'#f5f4f0',border:'#e8e5e0',color:'#1a1a1a'});

    const wrap = document.createElement('div');

    if (todasUrgentes.length > 0) {
      const t = document.createElement('div');
      t.className = 'sec-title';
      t.innerHTML = `ahora mismo <span class="badge">${todasUrgentes.length}</span>`;

        } else {

          card.innerHTML = `<div class="row-top"><div class="item-title" style="color:#791F1F;">${f['Título']||''}</div>${f['Categoría']?`<span class="tag tag-${f['Categoría']}">${f['Categoría']}</span>`:''}</div>
            ${f['Descripción']?`<div class="item-desc" style="color:#A32D2D;">${f['Descripción']}</div>`:''}
            ${f['Respuesta de Michi']?`<span class="responded-tag">✓ ${f['Respuesta de Michi']}</span>`:''}

          wrap.appendChild(card);
        }
      });
    }

    if (preguntas.length > 0) {
      const t = document.createElement('div');
      t.className = 'sec-title';
      t.innerHTML = `te pregunto <span class="badge" id="q-badge">${preguntas.length}</span>`;
      wrap.appendChild(t);
      preguntas.forEach(r => {
        const f = r.fields;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<div class="cat-mini"><div class="cat-label">${f['Categoría']||''}</div></div>

          <div style="flex:1;min-width:0;">
            <div style="font-size:12px;font-weight:500;color:#1a1a1a;">${remitente}</div>
            <div style="font-size:13px;font-weight:500;color:#1a1a1a;margin:2px 0;">${asunto}</div>
            ${f['Urgente']?'<span style="font-size:10px;background:#FCEBEB;color:#A32D2D;padding:2px 8px;border-radius:10px;">urgente</span>':''}
            ${f['Respuesta de Michi']
              ?`<div style="font-size:11px;color:#1D9E75;margin-top:4px;">✓ ${f['Respuesta de Michi']}</div>`
              :`<div style="font-size:11px;color:#888;margin-top:4px;">toca para responder →</div>`}
          </div>
        </div>`;
        wrap.appendChild(card);
      });
    }

    if (eventos.length > 0) {
      const t = document.createElement('div');
      t.className = 'sec-title';
      t.textContent = '📍 eventos';
      wrap.appendChild(t);
      eventos.forEach(r => {
        const f = r.fields;
        const card = document.createElement('div');
        card.className = 'card';
        card.style.borderLeft = '3px solid #534AB7';
        card.innerHTML = `<div class="row-top">
          <div class="item-title">${f['Título']||''}</div>
          ${f['Categoría']?`<span class="tag tag-${f['Categoría']}">${f['Categoría']}</span>`:''}
        </div>
        ${f['Descripción']?`<div class="item-desc">${f['Descripción']}</div>`:''}
        ${f['Fecha límite']?`<div style="font-size:12px;color:#534AB7;font-weight:500;margin-top:4px;">📅 ${fechaBonita(f['Fecha límite'])}${f['Link']?' — <a href="'+f['Link']+'" target="_blank" style="color:#534AB7;">ver detalles →</a>':''}</div>`:''}`;
        card.innerHTML += makeCommentBox(r.id, 'Michi');
        wrap.appendChild(card);
      });
    }

    if (tareas.length > 0) {
      const t = document.createElement('div');
      t.className = 'sec-title';
      t.textContent = 'pendientes del día';
      wrap.appendChild(t);
      const cardWrap = document.createElement('div');
      cardWrap.className = 'card';
      cardWrap.style.cssText = 'border-color:#FAC775;background:#FFFBF0;';
      tareas.forEach(r => {
        const f = r.fields;
        const done = f['Estado']==='Hecho';
        const item = document.createElement('div');
        item.className = 'check-item';
        item.style.cssText = '';
        item.onclick = () => toggleCheck(item, r.id);
        item.innerHTML = `<div class="check ${done?'done':''}" onclick="toggleCheck(this,'${r.id}');event.stopPropagation();">${done?'<div class="tick"></div>':''}</div>
          <div class="check-body" style="flex:1;">
            <div class="check-txt ${done?'done':''}">${f['Título']||''}</div>
            ${f['Descripción']?`<div style="font-size:11px;color:#888;margin-top:2px;">${f['Descripción']}</div>`:''}
            ${makeCommentBox(r.id,'Michi')}
          </div>`;
        cardWrap.appendChild(item);
      });
      wrap.appendChild(cardWrap);
    }

    if (!wrap.children.length) wrap.innerHTML = '<div class="empty-state">No hay nada por hoy. Don descansa contigo.</div>';
    container.innerHTML = '';
    container.appendChild(wrap);

    // Load threads
    records.forEach(r => {
      const convoEl = document.getElementById('convo-'+r.id);
      if (convoEl) loadThreadComments(r.id, convoEl);
    });

  } catch(e) { container.innerHTML = `<div class="empty-state">Error: ${e.message}</div>`; }
}

async function loadDeadlines() {
  const container = document.getElementById('deadlines-container');
  container.innerHTML = '<div class="big-spinner"></div>';
  try {
    const data = await api(`Tareas?filterByFormula=%7BTipo%7D%3D%22Deadline%22`);
    const records = (data.records||[]).sort((a,b)=>(diasRestantes(a.fields['Fecha límite'])??999)-(diasRestantes(b.fields['Fecha límite'])??999));
    if (!records.length) { container.innerHTML='<div class="empty-state">No hay deadlines. Don tranquilo.</div>'; return; }
    const wrap = document.createElement('div');
    records.forEach(r => wrap.appendChild(makeDeadlineCard(r, false)));
    container.innerHTML='';
    container.appendChild(wrap);
    records.forEach(r => {
      const convoEl = document.getElementById('convo-'+r.id);
      if (convoEl) loadThreadComments(r.id, convoEl);
    });
    document.getElementById('notif-deadlines').style.display='none';
  } catch(e) { container.innerHTML=`<div class="empty-state">Error: ${e.message}</div>`; }
}

async function loadCorreos() {
  const container = document.getElementById('correos-container');
  container.innerHTML = '<div class="big-spinner"></div>';
  try {
    const data = await api(`Tareas?filterByFormula=%7BTipo%7D%3D%22Correo%22&sort%5B0%5D%5Bfield%5D=Urgente&sort%5B0%5D%5Bdirection%5D=desc`);
    const records = data.records||[];
    if (!records.length) { container.innerHTML='<div class="empty-state">No hay correos importantes por ahora.</div>'; return; }

    const pendientes = records.filter(r=>r.fields['Estado']!=='Hecho');
    const vistos = records.filter(r=>r.fields['Estado']==='Hecho');
    const wrap = document.createElement('div');

    if (pendientes.length>0) {
      const t = document.createElement('div');
      t.className='sec-title';
      t.innerHTML=`por revisar <span class="badge">${pendientes.length}</span>`;
      wrap.appendChild(t);

      pendientes.forEach(r => {
        const f = r.fields;
        const parts = (f['Título']||'').split(' — ');
        const remitente = parts.length>1?parts[0]:'';
        const asunto = parts.length>1?parts.slice(1).join(' — '):f['Título'];
        const initials = remitente?remitente.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2):'✉';
        const card = document.createElement('div');
        card.className = f['Urgente']?'card card-fire':'card';
        card.innerHTML = `<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;">
          <div style="width:36px;height:36px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#3C3489;flex-shrink:0;">${initials}</div>
          <div style="flex:1;min-width:0;"><div style="font-size:12px;font-weight:500;color:#1a1a1a;">${remitente||'Sin remitente'}</div><div style="font-size:13px;font-weight:500;color:#1a1a1a;margin:2px 0;">${asunto}</div>${f['Urgente']?'<span style="font-size:10px;background:#FCEBEB;color:#A32D2D;padding:2px 8px;border-radius:10px;">urgente</span>':''}</div>
        </div>`;

        if (f['Descripción']) {
          const descId = 'desc-'+r.id;
          card.innerHTML += `<div id="${descId}" style="font-size:12px;color:#888;line-height:1.5;margin-bottom:4px;padding:10px;background:#f9f8f5;border-radius:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${f['Descripción']}</div>
            <span id="vmas-${r.id}" style="font-size:11px;color:#534AB7;cursor:pointer;margin-bottom:8px;display:inline-block;" onclick="toggleDesc('${r.id}')">ver más</span>`;
        }

        if (f['Link']) card.innerHTML += `<a href="${f['Link']}" target="_blank" style="font-size:12px;color:#534AB7;display:block;margin-bottom:8px;" onclick="openGmail(event, this.href)">ver correo original →</a>`;
        if(f['Respuesta de Michi']){
          card.innerHTML += `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="responded-tag">✓ ${f['Respuesta de Michi']}</span>
            <span onclick="cambiarRespuestaCorreo('${r.id}',this);event.stopPropagation();" style="font-size:11px;color:#888;cursor:pointer;text-decoration:underline;">cambiar</span>
          </div>`;
        } else {
          card.innerHTML += `<div class="btn-row" id="cbtn-${r.id}"><div class="btn btn-si" onclick="respondCorreo(this,'${r.id}','respóndele tú')">respóndele tú</div><div class="btn btn-no" onclick="respondCorreo(this,'${r.id}','lo hago yo')">lo hago yo</div><div class="btn" onclick="respondCorreo(this,'${r.id}','archivar')">archivar</div></div>`;
        }
        card.innerHTML += makeCommentBox(r.id,'Michi');
        wrap.appendChild(card);
      });
    }

    if (vistos.length>0) {
      const t=document.createElement('div'); t.className='sec-title'; t.style.marginTop='16px'; t.textContent='ya vistos'; wrap.appendChild(t);
      vistos.forEach(r => {
        const f=r.fields; const parts=(f['Título']||'').split(' — ');
        const remitente=parts.length>1?parts[0]:''; const asunto=parts.length>1?parts.slice(1).join(' — '):f['Título'];
        const initials=remitente?remitente.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2):'✉';
        const card=document.createElement('div'); card.className='card'; card.style.opacity='0.6';
        card.innerHTML=`<div style="display:flex;align-items:center;gap:10px;"><div style="width:32px;height:32px;border-radius:50%;background:#f5f4f0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#888;flex-shrink:0;">${initials}</div><div><div style="font-size:12px;font-weight:500;color:#888;">${remitente}</div><div style="font-size:12px;color:#aaa;">${asunto}</div></div><span style="margin-left:auto;font-size:10px;color:#1D9E75;">✓ ${f['Respuesta de Michi']||'visto'}</span></div>`;
        wrap.appendChild(card);
      });
    }

    container.innerHTML=''; container.appendChild(wrap);
    pendientes.forEach(r => {
      const convoEl=document.getElementById('convo-'+r.id);
      if (convoEl) loadThreadComments(r.id, convoEl);
    });
    document.getElementById('notif-correos').style.display='none';
  } catch(e) { container.innerHTML=`<div class="empty-state">Error: ${e.message}</div>`; }
}

function toggleDesc(id) {
  const el = document.getElementById('desc-'+id);
  const btn = document.getElementById('vmas-'+id);
  if (!el||!btn) return;
  const collapsed = el.style.webkitLineClamp==='3'||el.style.display.includes('-webkit-box');
  if (collapsed) {
    el.style.webkitLineClamp='unset'; el.style.display='block'; btn.textContent='ver menos';
  } else {
    el.style.webkitLineClamp='3'; el.style.display='-webkit-box'; btn.textContent='ver más';
  }
}

async function respondCorreo(btn, recordId, valor) {
  event.stopPropagation();
  const row = btn.closest('.btn-row');
  row.innerHTML=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span class="responded-tag">✓ ${valor}</span>
    <span onclick="cambiarRespuestaCorreo('${recordId}',this);event.stopPropagation();" style="font-size:11px;color:#888;cursor:pointer;text-decoration:underline;">cambiar</span>
  </div>`;
  await apiPatch('Tareas',recordId,{'Respuesta de Michi':valor,'Estado':'Hecho'});
}

async function cambiarRespuestaCorreo(recordId, el) {
  el.closest('div').innerHTML=`<div class="btn-row"><div class="btn btn-si" onclick="respondCorreo(this,'${recordId}','respóndele tú')">respóndele tú</div><div class="btn btn-no" onclick="respondCorreo(this,'${recordId}','lo hago yo')">lo hago yo</div><div class="btn" onclick="respondCorreo(this,'${recordId}','archivar')">archivar</div></div>`;
  await apiPatch('Tareas', recordId, {'Respuesta de Michi': '', 'Estado': 'Pendiente'});
}

async function loadHistorial() {
  const container = document.getElementById('historial-container');
  container.innerHTML='<div class="big-spinner"></div>';
  try {
    const data = await api(`Tareas?filterByFormula=%7BEstado%7D%3D%22Hecho%22`);
    const records = data.records||[];
    if (!records.length) { container.innerHTML='<div class="empty-state">Nada hecho todavía. Don espera.</div>'; return; }
    const wrap=document.createElement('div');
    records.forEach(r => {
      const f=r.fields;
      const card=document.createElement('div'); card.className='card'; card.style.opacity='0.7';
      card.innerHTML=`<div class="row-top"><div class="item-title" style="text-decoration:line-through;color:#888;">${f['Título']||''}</div>${f['Categoría']?`<span class="tag tag-${f['Categoría']}">${f['Categoría']}</span>`:''}</div><div style="font-size:11px;color:#1D9E75;margin-top:4px;">✓ ${f['Respuesta de Michi']||'completado'}</div>`;
      wrap.appendChild(card);
    });
    container.innerHTML=''; container.appendChild(wrap);
  } catch(e) { container.innerHTML=`<div class="empty-state">Error: ${e.message}</div>`; }
}

function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-it').forEach(n=>n.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  window.scrollTo(0,0);
  const greetings = {hoy:'buenos días',deadlines:'tus fechas límite',correos:'correos importantes',historial:'historial'};
  document.getElementById('top-greeting').textContent = greetings[name]||'';
  if (name==='hoy') { document.getElementById('notif-hoy').style.display='none'; localStorage.setItem('last_seen_hoy',new Date().toISOString()); }
  screenHistory.push(name);
  history.pushState(null, '', window.location.href);
}

loadHoy();

// Android back button navigation
const screenHistory = ['hoy'];
window.addEventListener('popstate', (e) => {
  if (screenHistory.length > 1) {
    screenHistory.pop();
    const prev = screenHistory[screenHistory.length - 1];
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.nav-it').forEach(n=>n.classList.remove('active'));
    document.getElementById('screen-'+prev).classList.add('active');
    document.getElementById('nav-'+prev).classList.add('active');
    history.pushState(null, '', window.location.href);
  }
});
history.pushState(null, '', window.location.href);
setInterval(()=>{
  const focused = document.activeElement;
  if (focused && (focused.tagName==='INPUT'||focused.tagName==='TEXTAREA')) return;
  if (window.scrollY > 100) return;
  const active = document.querySelector('.screen.active');
  if (!active) return;
  const id = active.id;
  if (id==='screen-hoy') loadHoy();
  else if (id==='screen-deadlines') loadDeadlines();
  else if (id==='screen-correos') loadCorreos();
}, 30000);

function openGmail(e, url) {
  // Try to open Gmail app on mobile
  if (url && url.includes('mail.google.com')) {
    e.preventDefault();
    // Extract message ID if possible
    const match = url.match(/#(?:inbox|sent|all)\/([A-Za-z0-9]+)/);
    if (match) {
      const msgId = match[1];
      // Try Gmail app deep link
      const gmailApp = `googlegmail://mail?message_id=${msgId}`;
      const fallback = url;
      const start = Date.now();
      window.location = gmailApp;
      setTimeout(() => {
        if (Date.now() - start < 1500) window.open(fallback, '_blank');
      }, 500);
    } else {
      window.open(url, '_blank');
    }
  }
}
